[project]
name = "endstone-chat-relay"
version = "1.2.1"
description = "Lightweight chat relay for multi-server Endstone networks"
requires-python = ">=3.10"
dependencies = [
  "endstone>=0.11.8,<0.12",
  "discord.py>=2.3.0",
]

[project.entry-points.endstone]
chat-relay = "endstone_chat_relay.plugin:ChatRelayPlugin"

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_chat_relay"]
